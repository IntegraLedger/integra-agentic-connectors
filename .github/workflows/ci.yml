name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: A DCO sign-off and no agent trailer on every commit in the checked commit's history
        run: |
          set -euo pipefail
          unsigned=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$GITHUB_SHA" | awk 'NF<2')
          agent=$(git rev-list "$GITHUB_SHA" | while read -r c; do
            git show -s --format=%B "$c" | grep -Ei 'co-authored-by|generated with|claude|anthropic' | sed "s/^/${c:0:12} /" || true
          done)
          [ -z "$unsigned" ] || printf 'commits without a Signed-off-by: trailer:\n%s\n' "$unsigned"
          [ -z "$agent" ] || printf 'commit messages naming an agent:\n%s\n' "$agent"
          if [ -n "$unsigned" ] || [ -n "$agent" ]; then exit 1; fi
          echo "$(git rev-list --count "$GITHUB_SHA") commits reachable from $GITHUB_SHA: each is signed off and names no agent"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: One-way imports (the @integraledger packages here depend on and name only @integraledger/lcp), and each workspace package's scripts
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const allowed = () => ["@integraledger/lcp"];
          const code = /\.(?:[cm]?[jt]sx?)$/;
          const specifier = /(?:\bfrom|\bimport|\brequire\s*\()\s*\(?\s*["'`](@integraledger\/[^"'`/]+)/g;
          // In an @integraledger package every quoted @integraledger name counts, however it is loaded or resolved
          // (createRequire, require.resolve, import.meta.resolve, a types reference).
          const named = /["'`](@integraledger\/[^"'`/\s]+)/g;
          // The site is the one folder outside the workspace (the install-policy step holds pnpm-workspace.yaml's
          // packages to "*" and "!website"): it runs no workspace script.
          const outside = new Set(["website"]);
          const dependencies = (pkg, manifest) => {
            const found = [];
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] ?? {})) {
                // An npm alias installs its target under another name: the target is the dependency.
                const target = /^npm:(@integraledger\/[^@]+)/.exec(String(spec))?.[1];
                for (const n of [name, target]) if (n?.startsWith("@integraledger/")) found.push([n, `${manifest} ${field}`]);
              }
            }
            return found;
          };
          let packages = 0;
          let bad = 0;
          // The root manifest's dependencies resolve from every package below it.
          for (const [name, where] of dependencies(JSON.parse(fs.readFileSync("package.json", "utf8")), "package.json")) {
            if (!allowed().includes(name)) {
              console.log(`${where}: ${name}`);
              bad++;
            }
          }
          for (const dir of fs.readdirSync(".").sort()) {
            const manifest = path.join(dir, "package.json");
            if (!fs.existsSync(manifest)) continue;
            packages++;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            const ok = new Set([pkg.name, ...allowed(pkg.name)]);
            const found = dependencies(pkg, manifest);
            if (!outside.has(dir)) {
              for (const script of ["build", "typecheck", "test"]) {
                if (typeof pkg.scripts?.[script] !== "string" || pkg.scripts[script].trim() === "") {
                  console.log(`${manifest}: no ${script} script, so pnpm -r --if-present run ${script} skips it`);
                  bad++;
                }
              }
            }
            const pattern = String(pkg.name).startsWith("@integraledger/") ? named : specifier;
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                // The package's own dist is its build output; a folder named dist below it is source, which the
                // build reads.
                if (e.name === "node_modules" || (d === dir && e.name === "dist") || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (code.test(e.name)) {
                  for (const m of fs.readFileSync(p, "utf8").matchAll(pattern)) found.push([m[1], p]);
                }
              }
            };
            walk(dir);
            for (const [name, where] of found) {
              if (!ok.has(name)) {
                console.log(`${where}: ${name}`);
                bad++;
              }
            }
          }
          if (packages === 0) {
            console.log("no package.json one level down: nothing was checked");
            process.exit(1);
          }
          if (bad > 0) process.exit(1);
          console.log(`${packages} package(s) and the root: no @integraledger dependency, import or name outside the allowed set; each workspace package has a build, typecheck and test script`);
          EOF
      - name: Every job that runs a step fetches the Node.js .node-version names first, and checks it against one SHA-256, and every download retries five times
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const v = fs.readFileSync(".node-version", "utf8").trim();
          const bad = [];
          // Spelled in parts, so that this step's own lines do not hold what it looks for.
          const PATH_FILE = ["GITHUB", "PATH"].join("_");
          const ENV_FILE = ["GITHUB", "ENV"].join("_");
          // Every download retries a failed transfer five times, whatever the error, and writes one file.
          const FETCH = ["cu", "rl -fsSL --retry 5 --retry-all-errors"].join("");
          const fetchLine = new RegExp(`^ +${FETCH} -o "\\$RUNNER_TEMP/[^"\\s]+" https://[^\\s"'\`]+$`);
          if (process.version !== `v${v}`) bad.push(`node ${process.version} runs this step, where .node-version names ${v}`);
          const tarball = `node-v${v}-linux-x64.tar.xz`;
          const url = `https://nodejs.org/dist/v${v}/${tarball}`;
          const files = fs.readdirSync(".github/workflows").filter((f) => /\.ya?ml$/.test(f)).sort().map((f) => `.github/workflows/${f}`);
          const text = new Map(files.map((f) => [f, fs.readFileSync(f, "utf8").split("\n")]));
          const all = [...text.values()].flat();
          for (const u of all.join("\n").match(/https:\/\/nodejs\.org\/dist\/v[0-9][^\s"']*/g) ?? []) if (u !== url) bad.push(`a Node.js other than ${url}: ${u}`);
          const check = new RegExp(`^ +echo "([0-9a-f]{64})  \\$RUNNER_TEMP/${tarball.replaceAll(".", "\\.")}" \\| sha256sum -c -$`);
          const digests = [...new Set(all.map((l) => check.exec(l)?.[1]).filter(Boolean))];
          if (digests.length !== 1) bad.push(`${digests.length} SHA-256 digests for ${tarball}, where there is one`);
          // The one Fetch Node.js step, byte for byte, so that no key can be added to it.
          const step = [
            "      - name: Fetch Node.js",
            "        run: |",
            "          set -eu",
            `          ${FETCH} -o "$RUNNER_TEMP/${tarball}" ${url}`,
            `          echo "${digests[0]}  $RUNNER_TEMP/${tarball}" | sha256sum -c -`,
            '          mkdir "$RUNNER_TEMP/node"',
            `          tar -xJf "$RUNNER_TEMP/${tarball}" -C "$RUNNER_TEMP/node" --strip-components=1`,
            `          echo "$RUNNER_TEMP/node/bin" >> "$${PATH_FILE}"`,
          ];
          const paths = new Set([step[7], `          echo "$RUNNER_TEMP/pnpm" >> "$${PATH_FILE}"`]);
          const blank = (l) => /^\s*(#.*)?$/.test(l);
          let jobs = 0;
          for (const [f, lines] of text) {
            const at = (i) => `${f}:${i + 1}`;
            lines.forEach((l, i) => {
              // Nothing runs another Node.js or another shell, changes PATH or the environment of the steps after
              // it, or lets a step or a job be skipped or fail without failing the run.
              if (/setup-[n]ode|continue-on-[e]rror|^\s*(- )?(if|container|shell|PATH):/.test(l)) bad.push(`${at(i)}: ${l.trim()}`);
              if (l.includes(PATH_FILE) && !paths.has(l)) bad.push(`${at(i)}: a PATH entry other than the fetched Node.js and pnpm`);
              if (l.includes(ENV_FILE)) bad.push(`${at(i)}: a step sets the environment of the steps after it`);
              if (/\bcu[r]l\b/.test(l) && !fetchLine.test(l)) bad.push(`${at(i)}: a download other than ${FETCH} -o "$RUNNER_TEMP/<file>" https://<address>: ${l.trim()}`);
            });
            // The patterns here read lines, so every workflow is written in YAML's plain block style: outside a block
            // scalar (`run: |`), a line is blank, a comment, one plain key and its value, or a sequence entry that is
            // one plain word (a port mapping such as 5432:5432). No value is a flow mapping other than {}, a flow
            // sequence of anything but plain words, an anchor, an alias, a tag, a quoted scalar that does not close on
            // its own line, or a block scalar whose header holds more than its indicators and a comment. The jobs'
            // steps are read only on the lines outside a block scalar.
            let scalar = -1;
            const inside = new Set();
            lines.forEach((l, i) => {
              const indent = l.length - l.trimStart().length;
              if (scalar >= 0 && (l.trim() === "" || indent > scalar)) {
                inside.add(i);
                return;
              }
              scalar = -1;
              if (blank(l)) return;
              const key = /^( *)(- )?[A-Za-z0-9_-]+:(?: +(.*))?$/.exec(l);
              const word = /^ *- [A-Za-z0-9_./][A-Za-z0-9_./-]*(:[A-Za-z0-9_./-]+)*$/.test(l);
              const value = (key?.[3] ?? "").replace(/(^| +)#.*$/, "");
              const quoted = /^['"]/.test(key?.[3] ?? "") && !/^('([^']|'')*'|"([^"\\]|\\.)*")( +#.*)?$/.test(key[3]);
              const header = /^[|>]/.test(value) && !/^[|>][-+1-9]*$/.test(value);
              if ((key === null && !word) || quoted || header || /^[&*!]/.test(value) || (value.startsWith("{") && value !== "{}") || (value.startsWith("[") && !/^\[[^\][{}:#"']*\]$/.test(value))) {
                bad.push(`${at(i)}: not one plain key and value: ${l.trim()}`);
              } else if (/^[|>][-+1-9]*$/.test(value)) scalar = key[1].length + (key[2] ? 2 : 0);
            });
            const start = lines.indexOf("jobs:");
            if (start < 0 || lines.lastIndexOf("jobs:") !== start) {
              bad.push(`${f}: no single line "jobs:"`);
              continue;
            }
            // Every line under jobs: is blank, a comment, a job's own line "  <name>:", or indented inside a job.
            const found = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (blank(lines[i])) continue;
              if (/^  [A-Za-z0-9_-]+:$/.test(lines[i])) {
                if (found.length > 0) found.at(-1).to = i;
                found.push({ name: lines[i].trim().slice(0, -1), from: i + 1, to: lines.length });
              } else if (!/^    /.test(lines[i]) || found.length === 0) bad.push(`${at(i)}: neither a job's line "  <name>:" nor a line inside a job`);
            }
            if (found.length === 0) bad.push(`${f}: no job under "jobs:"`);
            for (const job of found) {
              const runs = [];
              for (let i = job.from; i < job.to; i++) if (!inside.has(i) && /^ +(- )?run:/.test(lines[i])) runs.push(i);
              if (runs.length === 0) continue;
              jobs++;
              const fetches = [];
              for (let i = job.from; i < job.to; i++) if (!inside.has(i) && step.every((s, k) => lines[i + k] === s)) fetches.push(i);
              let next = fetches[0] + step.length;
              while (next < job.to && blank(lines[next])) next++;
              if (fetches.length !== 1) bad.push(`${f}: job ${job.name} runs a step and holds the Fetch Node.js step ${fetches.length} times, where it holds it once`);
              else if (runs[0] !== fetches[0] + 1) bad.push(`${at(runs[0])}: job ${job.name} runs a step before it fetches Node.js`);
              else if (next < job.to && !lines[next].startsWith("      - ")) bad.push(`${at(next)}: job ${job.name}'s Fetch Node.js step carries a key it does not hold`);
            }
          }
          if (bad.length > 0) {
            console.log(`${bad.join("\n")}\nEvery job that runs a step holds, before its first other step that runs, the step:\n${step.join("\n")}`);
            process.exit(1);
          }
          console.log(`node ${process.version}: each of the ${jobs} jobs that runs a step fetches ${url} first and checks it against ${digests[0]}; every download is ${FETCH} -o "$RUNNER_TEMP/<file>" https://<address>`);
          JS
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - name: The install policy, as pnpm reads it, in every workspace file, manifest, lockfile, .npmrc and workflow
        run: |
          set -eu
          # First, the text of every pnpm-workspace.yaml, package.json, pnpm-lock.yaml and .npmrc git lists, the first
          # three at the root, and the names of the files git lists.
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path").posix;
          const listed = require("node:child_process").execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" });
          const tracked = new Set(listed.split("\0").filter(Boolean));
          const roots = ["pnpm-workspace.yaml", "package.json", "pnpm-lock.yaml"];
          const named = (r) => [...tracked].filter((f) => path.basename(f) === r);
          const [workspaces, manifests, lockfiles] = roots.map(named);
          for (const root of roots) {
            if (!tracked.has(root)) {
              console.log(`git lists no ${root} at the root, so the step checks nothing`);
              process.exit(1);
            }
          }
          const bad = [];
          const read = (f) => fs.readFileSync(f, "utf8").split("\n");
          const version = String.raw`[0-9]+\.[0-9]+\.[0-9]+`;
          const exact = new RegExp(`^${version}$`);
          // Every line of a workspace file is blank, a comment, one of these lines at its start, at most once, or an
          // entry of the block it opens, so no other setting is read, in any spelling. Any other key, such as
          // allowBuilds, allowSkills, ignoredBuiltDependencies, pnpmfile, globalPnpmfile or configDependencies, is
          // refused by name, and so is a line indented under a setting, which would continue its value. packages is the
          // root's alone, and every block holds an entry. autoInstallPeers may stand, as false only, so that no peer
          // enters an install unless a package declares it. Each line may end in a comment, one or more spaces, "#" and
          // any text, and what comes before it is held as the line would be without one; a "#" with no space before
          // it, or inside quotes, is part of the value.
          const settings = ["minimumReleaseAge: 1440", "trustPolicy: no-downgrade", "strictDepBuilds: true"];
          const optional = ["autoInstallPeers: false"];
          const blocks = [
            "permissions:", "minimumReleaseAgeExclude:", "overrides:", "catalog:", "catalogs:", "patchedDependencies:",
          ];
          const note = "(?: +#.*)?";
          // Under permissions each entry is a package name, plain, single- or double-quoted, mapped in flow style on
          // its line or in block style on the lines under it to build, skills or both, each false.
          const scoped = String.raw`(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9][A-Za-z0-9._~-]*`;
          const name = String.raw`([A-Za-z0-9][A-Za-z0-9._~-]*|"${scoped}"|'${scoped}')`;
          const both = "(build: false(, ?skills: false)?|skills: false(, ?build: false)?)";
          const decided = new RegExp(`^  ${name}: [{] ?${both} ?[}]${note}$`);
          const mapped = new RegExp(`^  ${name}:${note}$`);
          const choice = new RegExp(`^    (build|skills): false${note}$`);
          // Under packages each entry is a relative glob, plain, single- or double-quoted, with no ".." and no leading
          // "/", and a quoted "!" before a folder excludes it. Under minimumReleaseAgeExclude each entry is
          // '@integraledger/<name>@<x.y.z>', or pnpm's own form for more versions of one package,
          // '@integraledger/<name>@<x.y.z> || <x.y.z>', each further version after " || ", single- or double-quoted as
          // pnpm writes it, and every version one a lockfile installs. Under overrides each entry is a package,
          // plain, single- or double-quoted, and an exact registry version, plain, single- or double-quoted, which
          // minimumReleaseAge and trustPolicy read: no range, prerelease, URL, file:, link:, git, github: or npm:
          // alias. An override may instead remove a dependency, "-", single- or double-quoted, when its selector,
          // single- or double-quoted, names a parent at an exact version and a child with no version, so the removal
          // adds no code. Under catalog, which holds the versions a manifest names by catalog:, each entry is a package
          // name and an exact version, by the overrides rule, and no entry is a catalog: reference; under catalogs
          // each catalog's name, plain, single- or double-quoted, opens such entries on the lines under it. Under
          // patchedDependencies each entry is '<name>@<x.y.z>' and a file under the workspace's patches/ that git
          // lists.
          const quoted = String.raw`"(!?)([^"\\!][^"\\]*)"|'(!?)([^'!][^']*)'`;
          const glob = new RegExp(`^  - (?:${quoted}|([A-Za-z0-9._][A-Za-z0-9._*/-]*))${note}$`);
          const exempt = String.raw`(@integraledger/[a-z0-9][a-z0-9._~-]*)@(${version}(?: \|\| ${version})*)`;
          const excluded = new RegExp(`^  - (?:'${exempt}'|"${exempt}")${note}$`);
          const pin = `("${version}"|'${version}'|${version})`;
          const override = new RegExp(`^  ("[^"\\\\]+"|'[^']+'|[A-Za-z0-9][A-Za-z0-9._@/>-]*): ${pin}${note}$`);
          const cut = `${scoped}@${version}>${scoped}`;
          const removal = new RegExp(`^  ("${cut}"|'${cut}'): ("-"|'-')${note}$`);
          const pinned = new RegExp(`^  ${name}: ${pin}${note}$`);
          const catalogued = new RegExp(`^    ${name}: ${pin}${note}$`);
          const catalog = new RegExp(`^  ([A-Za-z0-9][A-Za-z0-9._~-]*|"[^"\\\\]+"|'[^']+'):${note}$`);
          const file = "patches(/[A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)+";
          const patch = new RegExp(`^  '(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9._~-]+@${version}': (${file})${note}$`);
          const globs = [];
          const exclusions = [];
          for (const f of workspaces) {
            const lines = read(f);
            const at = (i) => `${f}:${i + 1}: ${lines[i]}`;
            const root = f === "pnpm-workspace.yaml";
            const keys = [...settings, ...optional, ...blocks, ...(root ? ["packages:"] : [])];
            const names = keys.map((k) => k.replace(/:.*/, ""));
            // A line at the start that is not admitted is refused, and named by its key when no line here admits it.
            const refused = (i) => {
              const k = /^(?:"([^"]*)"|'([^']*)'|([^\s"'#][^:]*?)) *:( |$)/.exec(lines[i]);
              const word = k === null ? null : (k[1] ?? k[2] ?? k[3]);
              return word === null || names.includes(word) ? at(i) : `${at(i)} (the key ${word} is refused)`;
            };
            const seen = new Set();
            let key = null;
            let entries = 0;
            let open = null;
            const close = () => {
              if (open !== null && open.held.size === 0) bad.push(at(open.line));
              open = null;
            };
            const end = () => {
              close();
              const block = key !== null && keys.includes(key.line) && key.line.endsWith(":");
              if (block && entries === 0) bad.push(at(key.at));
            };
            lines.forEach((l, i) => {
              if (/^ *(#|$)/.test(l)) return;
              if (!l.startsWith(" ")) {
                end();
                const bare = l.replace(/ +#.*$/, "");
                if (!keys.includes(bare) || seen.has(bare)) bad.push(refused(i));
                seen.add(bare);
                [key, entries] = [{ line: bare, at: i }, 0];
                return;
              }
              entries++;
              if (key === null || !key.line.endsWith(":")) bad.push(at(i));
              else if (key.line === "permissions:" && l.startsWith("    ")) {
                const decision = l.trim().replace(/:.*/, "");
                const once = open !== null && !open.held.has(decision);
                if (!once || !choice.test(l)) bad.push(at(i));
                else open.held.add(decision);
              } else if (key.line === "permissions:") {
                close();
                if (mapped.test(l)) open = { line: i, held: new Set() };
                else if (!decided.test(l)) bad.push(at(i));
              } else if (key.line === "packages:" && root) {
                const m = glob.exec(l);
                const g = m === null ? "/" : m[2] ?? m[4] ?? m[5];
                if (g.startsWith("/") || g.includes("..")) bad.push(at(i));
                else globs.push((m[1] ?? m[3] ?? "") + g.replace(/^\.\//, ""));
              } else if (key.line === "minimumReleaseAgeExclude:") {
                const m = excluded.exec(l);
                if (m === null) bad.push(at(i));
                else for (const v of (m[2] ?? m[4]).split(" || ")) exclusions.push([at(i), `${m[1] ?? m[3]}@${v}`]);
              } else if (key.line === "overrides:" && !override.test(l) && !removal.test(l)) bad.push(at(i));
              else if (key.line === "catalog:" && !pinned.test(l)) bad.push(at(i));
              else if (key.line === "catalogs:" && l.startsWith("    ")) {
                if (open === null || !catalogued.test(l)) bad.push(at(i));
                if (open !== null) open.held.add(i);
              } else if (key.line === "catalogs:") {
                close();
                if (catalog.test(l)) open = { line: i, held: new Set() };
                else bad.push(at(i));
              } else if (key.line === "patchedDependencies:") {
                const m = patch.exec(l);
                if (m === null || !tracked.has(path.join(path.dirname(f), m[2]))) bad.push(at(i));
              }
            });
            end();
            for (const s of settings) if (!seen.has(s)) bad.push(`${f}: no line "${s}"`);
          }
          // A folder with a workspace file of its own is excluded from the root's packages by "!<folder>". A workspace
          // package is a folder holding a package.json git lists that a glob of the root's packages lists.
          for (const d of workspaces.map(path.dirname).filter((d) => d !== ".")) {
            if (!globs.includes(`!${d}`)) bad.push(`pnpm-workspace.yaml: no packages entry "!${d}"`);
          }
          const lists = (d, list) => list.some((g) => path.matchesGlob(d, g));
          const yes = globs.filter((g) => !g.startsWith("!"));
          const no = globs.filter((g) => g.startsWith("!")).map((g) => g.slice(1));
          const folders = manifests.map(path.dirname).filter((d) => d !== ".");
          const packages = new Set(folders.filter((d) => lists(d, yes) && !lists(d, no)));
          // Every package in every lockfile comes from the registry by its integrity. A link: is admitted only on an
          // importer's specifier or version line, to a workspace package as resolved from the importer's folder; every
          // other link:, every file: and every version that is neither a registry version nor such a link is refused.
          const integrity = /^ +resolution: \{integrity: sha512-[A-Za-z0-9+/]+={0,2}\}$/;
          const installed = new Set();
          for (const f of lockfiles) {
            let [section, importer] = [null, null];
            read(f).forEach((l, i) => {
              if (l === "") return;
              if (!l.startsWith(" ")) [section, importer] = [l, null];
              const entry = /^  (?:'([^']+)'|([^ '][^ ]*)):$/.exec(l);
              if (entry !== null && section === "importers:") importer = entry[1] ?? entry[2];
              if (entry !== null && section === "packages:") installed.add(entry[1] ?? entry[2]);
              const link = /^        (specifier|version): link:([A-Za-z0-9._@-][A-Za-z0-9._@/-]*)$/.exec(l);
              const linked = link === null || importer === null ? null : path.join(path.dirname(f), importer, link[2]);
              if (section === "importers:" && packages.has(linked)) return;
              const exotic = /(link|file):\S/i.test(l) || (/^ +resolution:/.test(l) && !integrity.test(l));
              if (exotic || (/^ +version: /.test(l) && !/^ +version: [0-9]/.test(l))) bad.push(`${f}:${i + 1}: ${l}`);
            });
          }
          for (const [at, entry] of exclusions) {
            if (!installed.has(entry)) bad.push(`${at} (no lockfile installs ${entry})`);
          }
          // Every manifest's pnpm.overrides, resolutions and overrides name exact registry versions, read leaf by leaf,
          // as npm's overrides nest a package's own overrides under its name.
          const walk = (where, value) => {
            if (value !== null && typeof value === "object" && !Array.isArray(value)) {
              for (const [key, v] of Object.entries(value)) walk(`${where} > ${key}`, v);
            } else if (typeof value !== "string" || !exact.test(value)) bad.push(`${where}: ${JSON.stringify(value)}`);
          };
          for (const f of manifests) {
            let m;
            try {
              m = JSON.parse(fs.readFileSync(f, "utf8"));
            } catch {
              bad.push(`${f}: not JSON`);
              continue;
            }
            const { resolutions, overrides } = m ?? {};
            const fields = { "pnpm.overrides": m?.pnpm?.overrides, resolutions, overrides };
            for (const [field, value] of Object.entries(fields)) if (value !== undefined) walk(`${f} ${field}`, value);
          }
          // Every .npmrc git lists, at any depth, holds only comments, blank lines, the line that names the npm
          // registry and engine-strict=true, whatever pnpm reads from it.
          const npmrc = ["registry=https://registry.npmjs.org/", "engine-strict=true"];
          for (const f of named(".npmrc")) {
            read(f).forEach((l, i) => {
              const admitted = /^[ \t]*([#;]|$)/.test(l) || npmrc.includes(l);
              if (!admitted) bad.push(`${f}:${i + 1}: ${l}`);
            });
          }
          // Git lists no .pnpmfile.cjs or .pnpmfile.mjs, at any depth: the hooks in the root's run at install time and
          // can rewrite any manifest or setting this step reads.
          for (const f of tracked) if (/^\.pnpmfile\.[cm]js$/.test(path.basename(f))) bad.push(f);
          if (bad.length > 0) {
            console.log(`these weaken the install policy:\n${bad.join("\n")}`);
            process.exit(1);
          }
          JS
          # Second, pnpm's own reading in each folder that holds a workspace file, before it installs anything: each of
          # the three settings exactly, every override an exact version or a removal below an exact version, every
          # catalog entry an exact version, autoInstallPeers unset or false, and no pnpmfile, globalPnpmfile or
          # configDependencies, whatever else pnpm reads besides the text.
          files=$(git ls-files -- pnpm-workspace.yaml '*/pnpm-workspace.yaml')
          for f in $files; do
            d=$(dirname "$f")
            for want in minimumReleaseAge=1440 trustPolicy=no-downgrade strictDepBuilds=true overrides=exact \
              catalogs=exact autoInstallPeers=false pnpmfile=undefined globalPnpmfile=undefined \
              configDependencies=undefined; do
              key=${want%%=*}
              if ! have=$(pnpm --dir "$d" config get "$key"); then
                printf 'pnpm cannot read %s in %s\n' "$key" "$d"
                exit 1
              fi
              # pnpm prints overrides and catalogs as JSON, an entry to a line, or undefined when there are none, and
              # each catalog's entries under its name, the default catalog's under "default"; each other line is kept
              # with its number. A removal is "-" from a parent at an exact version to a child with no version.
              v='[0-9]+\.[0-9]+\.[0-9]+'
              n='(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9][A-Za-z0-9._~-]*'
              pin='"[^"\]+": "'"$v"'",?'
              case $key in
                overrides) exact="undefined|[{}]|  $pin|  \"$n@$v>$n\": \"-\",?" ;;
                catalogs) exact='undefined|[{}]|  "[^"\]+": [{]|  [}],?|    '"$pin" ;;
                *) exact= ;;
              esac
              if [ -n "$exact" ]; then
                have=$(printf '%s\n' "$have" | grep -nvxE "$exact" || true)
                have=${have:-exact}
              fi
              # autoInstallPeers is false wherever it is set, and may be unset.
              if [ "$key" = autoInstallPeers ] && [ "$have" = undefined ]; then continue; fi
              if [ "$have" != "${want#*=}" ]; then
                printf 'pnpm reads %s in %s as "%s", not "%s"\n' "$key" "$d" "$have" "${want#*=}"
                exit 1
              fi
            done
          done
          # Third, no workflow sets pnpm's settings around the files: by an environment variable, a command-line setting
          # or the configuration command, by its name, its alias or its shorthands for reading and writing one key,
          # each of which may follow options, with pnpm called by name, by path, as pnpm.cjs or with a version. The
          # patterns are bracketed so that this step does not match itself. The one line admitted is this step's own
          # read above, which writes nothing, and only while it stands once in all the workflows. Every .yml and .yaml
          # file in .github/workflows is read, each match named by its file and line; a tree with none has nothing to
          # read, and a file grep cannot read fails the step.
          own='[^:]+:[0-9]+: {14}if ! have=\$\(pnp[m] --dir "\$d" config get "\$key"\); then'
          set --
          for w in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$w" ]; then set -- "$@" "$w"; fi
          done
          around=
          if [ $# -gt 0 ]; then
            around=$(grep -HniE 'pnpm[_]config_|--config[.]|\bpnpm(\.[cm]?js|@[^[:space:]]*)?[^[:alnum:][:space:]_.([-]*[[:space:]](.*[[:space:]])?(config|c|get|set)([[:space:]]|$)' "$@") || [ $? = 1 ]
          fi
          if [ "$(printf '%s\n' "$around" | grep -cxE "$own")" = 1 ]; then
            around=$(printf '%s\n' "$around" | grep -vxE "$own" || true)
          fi
          if [ -n "$around" ]; then
            printf 'these workflow lines set the install policy around the files:\n%s\n' "$around"
            exit 1
          fi
          echo "$(printf '%s\n' "$files" | wc -l) workspace file(s), the root's and one in each folder its packages exclude: pnpm reads minimumReleaseAge 1440, trustPolicy no-downgrade and strictDepBuilds true in each, every override as an exact version or a removal below one, every catalog entry as an exact version, autoInstallPeers unset or false, and no pnpmfile, globalPnpmfile or configDependencies; each records build and skills decisions only as false, excludes from the age only exact @integraledger/<name>@<x.y.z> versions a lockfile installs, one to an entry or joined by \" || \" as pnpm writes them, pins overrides and catalog entries only to exact registry versions, removes a dependency only below an exact parent version, patches only exact versions from patches/ files git lists, sets autoInstallPeers only to false, and holds nothing else, a comment after a line included; the root's packages are relative globs; every manifest's overrides and resolutions are exact versions; every lockfile takes each package from the registry by its integrity and links only to a workspace package; every .npmrc holds only comments, registry=https://registry.npmjs.org/ and engine-strict=true; git lists no .pnpmfile.cjs or .pnpmfile.mjs; none of the $# workflow(s) sets pnpm's settings"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - name: The tests, the contract's vectors among them
        env:
          INTEGRA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: pnpm -r --if-present run test

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: The generated reference pages match openapi.json, refusal-meanings.json, the vectors and the lcp registry
        run: node scripts/docs.mjs --check
      - name: Every TypeScript sample in the READMEs and docs/ type-checks, runs, and prints the output shown
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: node scripts/samples.mjs

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every page's last-updated date is its file's last commit, which only the full history gives.
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Fetch the browser that draws the diagrams and loads the pages, and check its archive against the SHA-256 scripts/browser.mjs holds
        working-directory: website
        run: pnpm run browser
      - name: The committed API pages match the source
        working-directory: website
        run: |
          set -eu
          pnpm run api
          api="$(node --input-type=module -e 'import { DOCS_DIR } from "./src/lib/docs-dir.ts"; console.log(DOCS_DIR)')/reference/api"
          git diff --exit-code -- "$api"
          untracked=$(git ls-files --others --exclude-standard -- "$api")
          if [ -n "$untracked" ]; then printf 'API pages not committed:\n%s\n' "$untracked"; exit 1; fi
          echo "the API pages in $api match the source"
      - run: pnpm build
        working-directory: website
      - name: The site's home page and machine-readable files
        working-directory: website
        run: |
          set -eu
          for f in out/index.html out/llms.txt out/llms-full.txt; do
            test -s "$f" || { echo "missing or empty: website/$f"; exit 1; }
          done
          echo "out/index.html, out/llms.txt and out/llms-full.txt exist"
      - name: The Markdown copies hold no relative links
        working-directory: website
        run: |
          set -eu
          copies=$(find out/md -name '*.md' | wc -l)
          test "$copies" -gt 0 || { echo "website/out/md holds no Markdown copies"; exit 1; }
          # A link to ./x, ../x or x.md resolves against /<page>.md, where nothing is served.
          status=0
          grep -rnoE --include='*.md' '\]\((\.\.?/|[^):/#?[:space:]]+\.md[#)])' out/md || status=$?
          case "$status" in
            0) echo "the Markdown copies above hold relative links"; exit 1 ;;
            1) echo "none of the $copies Markdown copies in out/md holds a relative link" ;;
            *) exit "$status" ;;
          esac
      - name: Every page loads under its own Content-Security-Policy, with no violation or error, names its links and finds each fragment
        working-directory: website
        run: node scripts/check-pages.mjs
      - name: The code highlighting gives one result however long tokenizing takes, in the themes' colours, and no other source highlights code
        working-directory: website
        run: node scripts/check-highlighting.mjs
      - name: The diagrams are drawn in the pinned browser and font alone, and the site serves that font
        working-directory: website
        run: node scripts/check-diagrams.mjs
      - name: Two builds of one commit are byte-equal
        working-directory: website
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          mv out "$RUNNER_TEMP/first-build"
          # The second build starts from no build state and from a browser fetched and checked again.
          rm -rf .next .browser
          pnpm run browser
          pnpm build
          status=0
          diff -r --brief "$RUNNER_TEMP/first-build" out || status=$?
          case "$status" in
            0) ;;
            1) echo "two builds of $sha differ in the files above"; exit 1 ;;
            *) exit "$status" ;;
          esac
          test -d "out/_next/static/$sha" || { echo "the two builds are equal, but their build ID is not the commit's sha, $sha"; exit 1; }
          echo "two builds of $sha are byte-equal: $(find out -type f | wc -l) files, under the build ID $sha"
