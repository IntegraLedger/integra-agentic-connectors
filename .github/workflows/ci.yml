name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: A DCO sign-off and no agent trailer on every commit in the checked commit's history
        run: |
          set -euo pipefail
          unsigned=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$GITHUB_SHA" | awk 'NF<2')
          agent=$(git rev-list "$GITHUB_SHA" | while read -r c; do
            git show -s --format=%B "$c" | grep -Ei 'co-authored-by|generated with|claude|anthropic' | sed "s/^/${c:0:12} /" || true
          done)
          [ -z "$unsigned" ] || printf 'commits without a Signed-off-by: trailer:\n%s\n' "$unsigned"
          [ -z "$agent" ] || printf 'commit messages naming an agent:\n%s\n' "$agent"
          if [ -n "$unsigned" ] || [ -n "$agent" ]; then exit 1; fi
          echo "$(git rev-list --count "$GITHUB_SHA") commits reachable from $GITHUB_SHA: each is signed off and names no agent"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: One-way imports (the @integraledger packages here depend on and name only @integraledger/lcp), and each workspace package's scripts
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const allowed = () => ["@integraledger/lcp"];
          const code = /\.(?:[cm]?[jt]sx?)$/;
          const specifier = /(?:\bfrom|\bimport|\brequire\s*\()\s*\(?\s*["'`](@integraledger\/[^"'`/]+)/g;
          // In an @integraledger package every quoted @integraledger name counts, however it is loaded or resolved
          // (createRequire, require.resolve, import.meta.resolve, a types reference).
          const named = /["'`](@integraledger\/[^"'`/\s]+)/g;
          // The site is the one folder outside the workspace (the install-policy step holds pnpm-workspace.yaml's
          // packages to "*" and "!website"): it runs no workspace script.
          const outside = new Set(["website"]);
          const dependencies = (pkg, manifest) => {
            const found = [];
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] ?? {})) {
                // An npm alias installs its target under another name: the target is the dependency.
                const target = /^npm:(@integraledger\/[^@]+)/.exec(String(spec))?.[1];
                for (const n of [name, target]) if (n?.startsWith("@integraledger/")) found.push([n, `${manifest} ${field}`]);
              }
            }
            return found;
          };
          let packages = 0;
          let bad = 0;
          // The root manifest's dependencies resolve from every package below it.
          for (const [name, where] of dependencies(JSON.parse(fs.readFileSync("package.json", "utf8")), "package.json")) {
            if (!allowed().includes(name)) {
              console.log(`${where}: ${name}`);
              bad++;
            }
          }
          for (const dir of fs.readdirSync(".").sort()) {
            const manifest = path.join(dir, "package.json");
            if (!fs.existsSync(manifest)) continue;
            packages++;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            const ok = new Set([pkg.name, ...allowed(pkg.name)]);
            const found = dependencies(pkg, manifest);
            if (!outside.has(dir)) {
              for (const script of ["build", "typecheck", "test"]) {
                if (typeof pkg.scripts?.[script] !== "string" || pkg.scripts[script].trim() === "") {
                  console.log(`${manifest}: no ${script} script, so pnpm -r --if-present run ${script} skips it`);
                  bad++;
                }
              }
            }
            const pattern = String(pkg.name).startsWith("@integraledger/") ? named : specifier;
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                // The package's own dist is its build output; a folder named dist below it is source, which the
                // build reads.
                if (e.name === "node_modules" || (d === dir && e.name === "dist") || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (code.test(e.name)) {
                  for (const m of fs.readFileSync(p, "utf8").matchAll(pattern)) found.push([m[1], p]);
                }
              }
            };
            walk(dir);
            for (const [name, where] of found) {
              if (!ok.has(name)) {
                console.log(`${where}: ${name}`);
                bad++;
              }
            }
          }
          if (packages === 0) {
            console.log("no package.json one level down: nothing was checked");
            process.exit(1);
          }
          if (bad > 0) process.exit(1);
          console.log(`${packages} package(s) and the root: no @integraledger dependency, import or name outside the allowed set; each workspace package has a build, typecheck and test script`);
          EOF
      - name: Every job that runs a step fetches the Node.js .node-version names first, and checks it against one SHA-256
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const v = fs.readFileSync(".node-version", "utf8").trim();
          const bad = [];
          // Spelled in parts, so that this step's own lines do not hold what it looks for.
          const PATH_FILE = ["GITHUB", "PATH"].join("_");
          const ENV_FILE = ["GITHUB", "ENV"].join("_");
          if (process.version !== `v${v}`) bad.push(`node ${process.version} runs this step, where .node-version names ${v}`);
          const tarball = `node-v${v}-linux-x64.tar.xz`;
          const url = `https://nodejs.org/dist/v${v}/${tarball}`;
          const files = fs.readdirSync(".github/workflows").filter((f) => /\.ya?ml$/.test(f)).sort().map((f) => `.github/workflows/${f}`);
          const text = new Map(files.map((f) => [f, fs.readFileSync(f, "utf8").split("\n")]));
          const all = [...text.values()].flat();
          for (const u of all.join("\n").match(/https:\/\/nodejs\.org\/dist\/v[0-9][^\s"']*/g) ?? []) if (u !== url) bad.push(`a Node.js other than ${url}: ${u}`);
          const check = new RegExp(`^ +echo "([0-9a-f]{64})  \\$RUNNER_TEMP/${tarball.replaceAll(".", "\\.")}" \\| sha256sum -c -$`);
          const digests = [...new Set(all.map((l) => check.exec(l)?.[1]).filter(Boolean))];
          if (digests.length !== 1) bad.push(`${digests.length} SHA-256 digests for ${tarball}, where there is one`);
          // The one Fetch Node.js step, byte for byte, so that no key can be added to it.
          const step = [
            "      - name: Fetch Node.js",
            "        run: |",
            "          set -eu",
            `          curl -fsSL -o "$RUNNER_TEMP/${tarball}" ${url}`,
            `          echo "${digests[0]}  $RUNNER_TEMP/${tarball}" | sha256sum -c -`,
            '          mkdir "$RUNNER_TEMP/node"',
            `          tar -xJf "$RUNNER_TEMP/${tarball}" -C "$RUNNER_TEMP/node" --strip-components=1`,
            `          echo "$RUNNER_TEMP/node/bin" >> "$${PATH_FILE}"`,
          ];
          const paths = new Set([step[7], `          echo "$RUNNER_TEMP/pnpm" >> "$${PATH_FILE}"`]);
          const blank = (l) => /^\s*(#.*)?$/.test(l);
          let jobs = 0;
          for (const [f, lines] of text) {
            const at = (i) => `${f}:${i + 1}`;
            lines.forEach((l, i) => {
              // Nothing runs another Node.js or another shell, changes PATH or the environment of the steps after
              // it, or lets a step or a job be skipped or fail without failing the run.
              if (/setup-[n]ode|continue-on-[e]rror|^\s*(- )?(if|container|shell|PATH):/.test(l)) bad.push(`${at(i)}: ${l.trim()}`);
              if (l.includes(PATH_FILE) && !paths.has(l)) bad.push(`${at(i)}: a PATH entry other than the fetched Node.js and pnpm`);
              if (l.includes(ENV_FILE)) bad.push(`${at(i)}: a step sets the environment of the steps after it`);
            });
            // The patterns here read lines, so every workflow is written in YAML's plain block style: outside a block
            // scalar (`run: |`), a line is blank, a comment, one plain key and its value, or a sequence entry that is
            // one plain word (a port mapping such as 5432:5432). No value is a flow mapping other than {}, a flow
            // sequence of anything but plain words, an anchor, an alias, a tag or a quoted scalar that does not close
            // on its own line. The jobs' steps are read only on the lines outside a block scalar.
            let scalar = -1;
            const inside = new Set();
            lines.forEach((l, i) => {
              const indent = l.length - l.trimStart().length;
              if (scalar >= 0 && (l.trim() === "" || indent > scalar)) {
                inside.add(i);
                return;
              }
              scalar = -1;
              if (blank(l)) return;
              const key = /^( *)(- )?[A-Za-z0-9_-]+:(?: +(.*))?$/.exec(l);
              const word = /^ *- [A-Za-z0-9_./][A-Za-z0-9_./-]*(:[A-Za-z0-9_./-]+)*$/.test(l);
              const value = (key?.[3] ?? "").replace(/(^| +)#.*$/, "");
              const quoted = /^['"]/.test(key?.[3] ?? "") && !/^('([^']|'')*'|"([^"\\]|\\.)*")( +#.*)?$/.test(key[3]);
              if ((key === null && !word) || quoted || /^[&*!]/.test(value) || (value.startsWith("{") && value !== "{}") || (value.startsWith("[") && !/^\[[^\][{}:#"']*\]$/.test(value))) {
                bad.push(`${at(i)}: not one plain key and value: ${l.trim()}`);
              } else if (/^[|>][-+1-9]*$/.test(value)) scalar = key[1].length + (key[2] ? 2 : 0);
            });
            const start = lines.indexOf("jobs:");
            if (start < 0 || lines.lastIndexOf("jobs:") !== start) {
              bad.push(`${f}: no single line "jobs:"`);
              continue;
            }
            // Every line under jobs: is blank, a comment, a job's own line "  <name>:", or indented inside a job.
            const found = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (blank(lines[i])) continue;
              if (/^  [A-Za-z0-9_-]+:$/.test(lines[i])) {
                if (found.length > 0) found.at(-1).to = i;
                found.push({ name: lines[i].trim().slice(0, -1), from: i + 1, to: lines.length });
              } else if (!/^    /.test(lines[i]) || found.length === 0) bad.push(`${at(i)}: neither a job's line "  <name>:" nor a line inside a job`);
            }
            if (found.length === 0) bad.push(`${f}: no job under "jobs:"`);
            for (const job of found) {
              const runs = [];
              for (let i = job.from; i < job.to; i++) if (!inside.has(i) && /^ +(- )?run:/.test(lines[i])) runs.push(i);
              if (runs.length === 0) continue;
              jobs++;
              const fetches = [];
              for (let i = job.from; i < job.to; i++) if (!inside.has(i) && step.every((s, k) => lines[i + k] === s)) fetches.push(i);
              let next = fetches[0] + step.length;
              while (next < job.to && blank(lines[next])) next++;
              if (fetches.length !== 1) bad.push(`${f}: job ${job.name} runs a step and holds the Fetch Node.js step ${fetches.length} times, where it holds it once`);
              else if (runs[0] !== fetches[0] + 1) bad.push(`${at(runs[0])}: job ${job.name} runs a step before it fetches Node.js`);
              else if (next < job.to && !lines[next].startsWith("      - ")) bad.push(`${at(next)}: job ${job.name}'s Fetch Node.js step carries a key it does not hold`);
            }
          }
          if (bad.length > 0) {
            console.log(`${bad.join("\n")}\nEvery job that runs a step holds, before its first other step that runs, the step:\n${step.join("\n")}`);
            process.exit(1);
          }
          console.log(`node ${process.version}: each of the ${jobs} jobs that runs a step fetches ${url} first and checks it against ${digests[0]}`);
          JS
      - name: The install policy, in the workspace and the site, their lockfiles and the workflows
        run: |
          set -eu
          for f in pnpm-workspace.yaml website/pnpm-workspace.yaml; do
            grep -qx 'minimumReleaseAge: 1440' "$f"
            grep -qx 'trustPolicy: no-downgrade' "$f"
            grep -qx 'strictDepBuilds: true' "$f"
            # Every line that starts a setting is one of these seven, so no other setting is read, in any spelling.
            top=$(grep -vE '^( |#|$)' "$f" | grep -vxE 'packages:|minimumReleaseAge: 1440|trustPolicy: no-downgrade|strictDepBuilds: true|allowBuilds:|minimumReleaseAgeExclude:|overrides:' || true)
            # Under allowBuilds every entry is a denial; under minimumReleaseAgeExclude the one entry is @integraledger/*;
            # under packages the entries are "*" and "!website"; under overrides each entry is a registry version, which
            # minimumReleaseAge and trustPolicy read (a file, link or git source has no release date to read).
            entries=$(awk '/^[^ #]/ { key = $0; next } /^ *(#|$)/ { next }
              (key == "allowBuilds:" && !/^  [^ ]+: false$/) ||
              (key == "minimumReleaseAgeExclude:" && $0 != "  - \"@integraledger/*\"") ||
              (key == "packages:" && $0 != "  - \"*\"" && $0 != "  - \"!website\"") ||
              (key == "overrides:" && !/^  ("[^"]+"|[A-Za-z0-9._-]+): [~^]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/)' "$f")
            if [ -n "$top$entries" ]; then
              printf '%s weakens the install policy:\n%s\n' "$f" "$(printf '%s\n' "$top" "$entries" | grep .)"
              exit 1
            fi
          done
          # The workspace is every folder but the site, so pnpm -r builds, type-checks and tests every package.
          workspace=$(awk '/^[^ #]/ { key = $0; next } key == "packages:" && /^  - /' pnpm-workspace.yaml)
          # Every package in both lockfiles comes from the registry by its integrity: no file, directory, git or tarball.
          exotic=$(grep -nE '^ +resolution:' pnpm-lock.yaml website/pnpm-lock.yaml | grep -vE ':[0-9]+: +resolution: \{integrity: sha512-[A-Za-z0-9+/]+={0,2}\}$' || true)
          # Every dependency a manifest names resolves to a registry version: a link to a folder has no resolution line.
          versions=$(grep -nE '^ +version: ' pnpm-lock.yaml website/pnpm-lock.yaml | grep -vE ':[0-9]+: +version: [0-9]' || true)
          # No workflow sets pnpm's settings around the files: by an environment variable, a command-line setting or the
          # configuration command, by its name, its alias or its shorthands for reading and writing one key, each of which
          # may follow options, with pnpm called by name, by path, as pnpm.cjs or with a version. The patterns are
          # bracketed so that this step does not match itself.
          around=$(grep -niE 'pnpm[_]config_|--config[.]|\bpnpm(\.[cm]?js|@[^[:space:]]*)?[^[:alnum:][:space:]_.([-]*[[:space:]](.*[[:space:]])?(config|c|get|set)([[:space:]]|$)' .github/workflows/*.yml || true)
          if [ "$workspace" != "$(printf '  - "*"\n  - "!website"')" ] || [ -n "$exotic$versions$around" ]; then
            printf 'the install policy is weakened outside the settings:\npnpm-workspace.yaml packages:\n%s\n%s\n' "$workspace" "$(printf '%s\n' "$exotic" "$versions" "$around" | grep . || true)"
            exit 1
          fi
          echo "pnpm-workspace.yaml and website/pnpm-workspace.yaml set minimumReleaseAge 1440 (excluding only @integraledger/*), trustPolicy no-downgrade and strictDepBuilds, allow no dependency build and override only to registry versions; the workspace is every folder but website; both lockfiles take every package and every dependency from the registry; no workflow sets pnpm's settings"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - name: The tests, the contract's vectors among them
        env:
          INTEGRA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: pnpm -r --if-present run test

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: The generated reference pages match openapi.json, refusal-meanings.json, the vectors and the lcp registry
        run: node scripts/docs.mjs --check
      - name: Every TypeScript sample in the READMEs and docs/ type-checks, runs, and prints the output shown
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: node scripts/samples.mjs

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every page's last-updated date is its file's last commit, which only the full history gives.
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Fetch the browser that draws the diagrams and loads the pages, and check its archive against the SHA-256 scripts/browser.mjs holds
        working-directory: website
        run: pnpm run browser
      - name: The committed API pages match the source
        working-directory: website
        run: |
          set -eu
          pnpm run api
          api="$(node --input-type=module -e 'import { DOCS_DIR } from "./src/lib/docs-dir.ts"; console.log(DOCS_DIR)')/reference/api"
          git diff --exit-code -- "$api"
          untracked=$(git ls-files --others --exclude-standard -- "$api")
          if [ -n "$untracked" ]; then printf 'API pages not committed:\n%s\n' "$untracked"; exit 1; fi
          echo "the API pages in $api match the source"
      - run: pnpm build
        working-directory: website
      - name: The site's home page and machine-readable files
        working-directory: website
        run: |
          set -eu
          for f in out/index.html out/llms.txt out/llms-full.txt; do
            test -s "$f" || { echo "missing or empty: website/$f"; exit 1; }
          done
          echo "out/index.html, out/llms.txt and out/llms-full.txt exist"
      - name: The Markdown copies hold no relative links
        working-directory: website
        run: |
          set -eu
          copies=$(find out/md -name '*.md' | wc -l)
          test "$copies" -gt 0 || { echo "website/out/md holds no Markdown copies"; exit 1; }
          # A link to ./x, ../x or x.md resolves against /<page>.md, where nothing is served.
          status=0
          grep -rnoE --include='*.md' '\]\((\.\.?/|[^):/#?[:space:]]+\.md[#)])' out/md || status=$?
          case "$status" in
            0) echo "the Markdown copies above hold relative links"; exit 1 ;;
            1) echo "none of the $copies Markdown copies in out/md holds a relative link" ;;
            *) exit "$status" ;;
          esac
      - name: Every page loads under its own Content-Security-Policy, with no violation or error, names its links and finds each fragment
        working-directory: website
        run: node scripts/check-pages.mjs
      - name: The code highlighting gives one result however long tokenizing takes, in the themes' colours, and no other source highlights code
        working-directory: website
        run: node scripts/check-highlighting.mjs
      - name: The diagrams are drawn in the pinned browser and font alone, and the site serves that font
        working-directory: website
        run: node scripts/check-diagrams.mjs
      - name: Two builds of one commit are byte-equal
        working-directory: website
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          mv out "$RUNNER_TEMP/first-build"
          # The second build starts from no build state and from a browser fetched and checked again.
          rm -rf .next .browser
          pnpm run browser
          pnpm build
          status=0
          diff -r --brief "$RUNNER_TEMP/first-build" out || status=$?
          case "$status" in
            0) ;;
            1) echo "two builds of $sha differ in the files above"; exit 1 ;;
            *) exit "$status" ;;
          esac
          test -d "out/_next/static/$sha" || { echo "the two builds are equal, but their build ID is not the commit's sha, $sha"; exit 1; }
          echo "two builds of $sha are byte-equal: $(find out -type f | wc -l) files, under the build ID $sha"
