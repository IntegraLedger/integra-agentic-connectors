name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A DCO sign-off and no agent trailer on every commit pushed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # The pushed range; the whole history when there is no earlier commit to start from.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          unsigned=$(git log --format='%h %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$range" | awk 'NF<2')
          agent=$(git rev-list "$range" | while read -r c; do
            git show -s --format=%B "$c" | grep -Ei 'co-authored-by|generated with|claude|anthropic' | sed "s/^/${c:0:12} /" || true
          done)
          [ -z "$unsigned" ] || printf 'commits without a Signed-off-by: trailer:\n%s\n' "$unsigned"
          [ -z "$agent" ] || printf 'commit messages naming an agent:\n%s\n' "$agent"
          if [ -n "$unsigned" ] || [ -n "$agent" ]; then exit 1; fi
          echo "every commit in $range is signed off and names no agent"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: One-way imports (the @integraledger packages here depend on and import only @integraledger/lcp)
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const allowed = () => ["@integraledger/lcp"];
          const code = /\.(?:[cm]?[jt]s|tsx)$/;
          const specifier = /(?:\bfrom|\bimport|\brequire\s*\()\s*\(?\s*["'](@integraledger\/[^"'/]+)/g;
          let packages = 0;
          let bad = 0;
          for (const dir of fs.readdirSync(".").sort()) {
            const manifest = path.join(dir, "package.json");
            if (!fs.existsSync(manifest)) continue;
            packages++;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            const ok = new Set([pkg.name, ...allowed(pkg.name)]);
            const found = [];
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const name of Object.keys(pkg[field] ?? {})) {
                if (name.startsWith("@integraledger/")) found.push([name, `${manifest} ${field}`]);
              }
            }
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name === "dist" || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (code.test(e.name)) {
                  for (const m of fs.readFileSync(p, "utf8").matchAll(specifier)) found.push([m[1], p]);
                }
              }
            };
            walk(dir);
            for (const [name, where] of found) {
              if (!ok.has(name)) {
                console.log(`${where}: ${name}`);
                bad++;
              }
            }
          }
          if (packages === 0) {
            console.log("no package.json one level down: nothing was checked");
            process.exit(1);
          }
          if (bad > 0) process.exit(1);
          console.log(`${packages} package(s): no @integraledger dependency or import outside the allowed set`);
          EOF
      - name: The Node.js every job fetches is the one .node-version names, against one SHA-256
        run: |
          set -eu
          v="$(cat .node-version)"
          test "$(node --version)" = "v$v"
          fetched=$(grep -ho 'https://nodejs\.org/dist/v[0-9][^ ]*' .github/workflows/*.yml)
          checked=$(grep -hoE '[0-9a-f]{64}  \$RUNNER_TEMP/node-' .github/workflows/*.yml)
          test "$(printf '%s\n' "$fetched" | sort -u)" = "https://nodejs.org/dist/v$v/node-v$v-linux-x64.tar.xz"
          test "$(printf '%s\n' "$checked" | sort -u | wc -l)" -eq 1
          test "$(printf '%s\n' "$fetched" | wc -l)" -eq "$(printf '%s\n' "$checked" | wc -l)"
          echo "node $(node --version), as .node-version names and every workflow fetches it, with npm $(npm --version)"
      - name: The install policy
        run: |
          set -eu
          grep -qx 'minimumReleaseAge: 1440' pnpm-workspace.yaml
          grep -qx 'trustPolicy: no-downgrade' pnpm-workspace.yaml
          grep -qx 'strictDepBuilds: true' pnpm-workspace.yaml
          echo "pnpm-workspace.yaml sets minimumReleaseAge 1440, trustPolicy no-downgrade and strictDepBuilds"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - name: The tests, the contract's vectors among them
        env:
          INTEGRA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: pnpm -r --if-present run test

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: The generated reference pages match openapi.json, the vectors and the lcp registry
        run: node scripts/docs.mjs --check
      - name: Every TypeScript sample in the READMEs and docs/ type-checks, runs, and prints the output shown
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: node scripts/samples.mjs

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - name: The committed API pages match the source
        working-directory: website
        run: |
          set -eu
          pnpm run api
          api="$(node --input-type=module -e 'import { DOCS_DIR } from "./src/lib/docs-dir.ts"; console.log(DOCS_DIR)')/reference/api"
          git diff --exit-code -- "$api"
          untracked=$(git ls-files --others --exclude-standard -- "$api")
          if [ -n "$untracked" ]; then printf 'API pages not committed:\n%s\n' "$untracked"; exit 1; fi
          echo "the API pages in $api match the source"
      - run: pnpm build
        working-directory: website
      - name: The site's home page and machine-readable files
        working-directory: website
        run: |
          set -eu
          for f in out/index.html out/llms.txt out/llms-full.txt; do
            test -s "$f" || { echo "missing or empty: website/$f"; exit 1; }
          done
          echo "out/index.html, out/llms.txt and out/llms-full.txt exist"
