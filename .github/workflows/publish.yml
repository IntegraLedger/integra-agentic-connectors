name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package folder to publish
        required: true
        type: choice
        options: [contract, profile-facilitator]

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: The tests, profile-facilitator's against the Postgres service
        env:
          INTEGRA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: pnpm -r --if-present run test
      - name: Pack
        run: |
          set -eu
          mkdir pack
          (cd "$PACKAGE" && pnpm pack --pack-destination ../pack)
          for f in pack/*.tgz; do
            echo "$f sha512-$(openssl dgst -sha512 -binary "$f" | base64 -w0)"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: pack/
          retention-days: 90

  stage:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: pack/
      - name: Stage
        run: |
          set -eu
          for f in pack/*.tgz; do
            npm stage publish "./$f"
          done
